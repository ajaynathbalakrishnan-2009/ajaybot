name: Build and syntax check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: node --check server/index.mjs
      - run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: python -m py_compile voice-agent/agent.py voice-agent/prompt.py
